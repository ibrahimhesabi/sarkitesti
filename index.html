const rnd=n=>Math.random()*n|0,defAv=()=>({hs:rnd(5),hc:rnd(6),sk:rnd(6),ec:rnd(5),fs:rnd(3),fit:rnd(6),bg:rnd(6)});

const OPT=[['hs','Saç stili',['Kısa','Uzun','Kıvırcık','Kel','Topuz']],['hc','Saç rengi',HC],['sk','Ten rengi',SK],['ec','Göz rengi',EC],['fs','Kıyafet',['Tişört','Gömlek','Kapüşon']],['fit','Kıyafet rengi',FC],['bg','Arka plan',BG]];
const creator=re=>OPT.map(([k,l,v])=>`<div class=cr><small>${l}</small><div class=row>${v.map((x,i)=>x[0]=='#'?`<button class="sw ${AV[k]==i?'on':''}" style="background:${x}" onclick="AV.${k}=${i};${re}()"></button>`:`<button class="chip ${AV[k]==i?'on':''}" onclick="AV.${k}=${i};${re}()">${x}</button>`).join('')}</div></div>`).join('');
const ld=()=>{try{return JSON.parse(localStorage.sa)}catch(e){return null}},save=()=>{try{localStorage.sa=JSON.stringify(P)}catch(e){}};
const sheet=(t,h)=>{const e=$('sh');e.className='on';e.innerHTML=`<div class=pn><div class=ph><b>${t}</b><button class=x onclick=closeSheet()>✕</button></div>${h}</div>`},closeSheet=()=>$('sh').className='';
const fav=(l,k)=>{const a=P[l],i=a.indexOf(k);i<0?a.push(k):a.splice(i,1);save()};
const players=()=>(P.grp[cfg.g]||{}).m||[{n:P.n,av:P.av}];
function theme(){document.documentElement.dataset.th=P.th||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.style.setProperty('--ac',ACS[P.ac||0])}
let draft;
function onboard(){draft={n:'',av:defAv()};AV=draft.av;ob()}
function ob(){app.innerHTML=`<div style="padding-top:20px"><h1>Hoş geldin 👋</h1><p class=sub>Bu cihazda bir misafir hesap açıyoruz. Adını yaz ve karakterini oluştur.</p><input class=in placeholder="Adın" value="${draft.n}" oninput="draft.n=this.value"><div class=c style="margin:14px">${av(AV,110)}</div>${creator('ob')}<button class=big onclick="fin()">Başla</button></div>`}
function fin(){P={n:draft.n.trim()||'Misafir',av:draft.av,fg:[],fc:[],use:{},th:'',ac:0,grp:[],last:{game:'guess',mode:'normal',cat:'Karışık',g:-1}};cfg=P.last;save();theme();home()}
function home(){stop();save();const g=GAMES[cfg.game],box=g.t=='box',gr=P.grp[cfg.g];
const tc=Object.entries(P.use).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(k=>CATS[k]),qc=[...new Set([...P.fc,...tc])].slice(0,8);
app.innerHTML=`<div class=top><b class=logo>🎵 Şarkı Arenası</b><button class=me onclick=profile()>${av(P.av,40)}</button></div>
<div class=hi>Merhaba, ${P.n} <small>Misafir</small></div>
<div class=card><button class=sel onclick=pickGame()><small>Oyun</small><b>${g.i} ${g.n}</b><span>›</span></button>
${box?'':`<button class=sel onclick=pickCat()><small>Kategori</small><b>${cfg.cat}</b><span>›</span></button><div class=seg>${Object.entries(MODES).map(([k,v])=>`<button class="${cfg.mode==k?'on':''}" onclick="cfg.mode='${k}';home()">${v}</button>`).join('')}</div>`}
<button class=sel style="border:0" onclick=grpSheet()><small>Oyuncular</small><b>${gr?`👥 ${gr.n} (${gr.m.length} kişi)`:'Tek kişi'}</b><span>›</span></button></div>

sheet('Kategori seç',`<div class=seg>${[['fav','★ Favoriler'],['tr','Türkçe'],['gl','Global']].map(([k,l])=>`<button class="${ct==k?'on':''}" onclick="ct='${k}';pickCat()">${l}</button>`).join('')}</div>${L.map(c=>`<div class="it ${cfg.cat==c[0]?'on':''}" onclick="cfg.cat='${c[0]}';closeSheet();home()"><div><b>${c[0]}</b><small>${SONGS.filter(c[2]).length} şarkı</small></div><button class=st onclick="event.stopPropagation();fav('fc','${c[0]}');pickCat()">${P.fc.includes(c[0])?'★':'☆'}</button></div>`).join('')||'<p class=sub>Henüz favori yok. Yıldıza dokun.</p>'}`)}

<h3>Yeni grup (en fazla 8 kişi, sen dahilsin)</h3><input id=gn class=in placeholder="Grup adı"><input id=gm class=in placeholder="Diğer oyuncular, virgülle ayır (en fazla 7)"><button class=big onclick=addG()>Grubu oluştur</button><p class=sub>Grup oyunlarında oyuncular aynı cihazda sırayla oynar.</p>`)}

<button class=sm style="width:100%;margin:6px 0" onclick=editAv()>🧑 Karakteri düzenle</button><button class=sm style="width:100%" onclick=grpSheet()>👥 Gruplarım</button>
<h3>Tema</h3><div class=seg>${[['','Otomatik'],['light','Açık'],['dark','Koyu']].map(([k,l])=>`<button class="${P.th==k?'on':''}" onclick="P.th='${k}';save();theme();profile()">${l}</button>`).join('')}</div><div class=row>${ACS.map((c,i)=>`<button class="sw ${(P.ac||0)==i?'on':''}" style="background:${c}" onclick="P.ac=${i};save();theme();profile()"></button>`).join('')}</div>
<h3>Hesap</h3><button class=sm style="width:100%;color:var(--bad)" onclick="if(confirm('Bu cihazdaki hesap ve tüm kayıtlar silinsin mi?')){localStorage.removeItem('sa');localStorage.removeItem('seen');location.reload()}">Misafir hesabı sil</button>`)}
function editAv(){AV=P.av;sheet('Karakter',`<div class=c>${av(AV,100)}</div>${creator('editAv')}<button class=big onclick="save();closeSheet();home()">Kaydet</button>`)}

/* ---------- SORU OYUNLARI ---------- */
function startQuiz(){
const need=!!GAMES[cfg.game].y,pool=SONGS.filter(CATS[cfg.cat]).filter(x=>!need||x.y);
if(pool.length<6){app.innerHTML='<p class="c q" style="margin-top:80px">Bu kategoride bu oyun için yeterli şarkı yok.</p><button class=big onclick=setup()>Menüye dön</button>';return}
Q={pool,bag:[],cur:0,asked:0,total:cfg.mode=='survival'?9999:Math.min(10,pool.length)*cfg.n,
ps:players().map(x=>({n:x.n,av:x.av,sc:0,l:3}))};next()}
let seen={};try{seen=JSON.parse(localStorage.seen||'{}')}catch(e){}
const pick=()=>{if(!Q.bag.length){const p=sh(Q.pool);let u=p.filter(x=>!seen[x.a+x.t]);if(u.length<Math.min(8,p.length)){p.forEach(x=>delete seen[x.a+x.t]);u=p}Q.bag=u}
const s=Q.bag.pop();seen[s.a+s.t]=1;try{localStorage.seen=JSON.stringify(seen)}catch(e){}return s};
const opts=(f,v)=>{const S=new Set([v]);for(const x of sh(Q.pool).concat(sh(SONGS))){if(S.size>3)break;S.add(f(x))}return sh([...S])};

async function next(){
if(Q.asked>=Q.total||!Q.ps.some(p=>p.l>0))return end();
while(Q.ps[Q.cur].l<=0)Q.cur=(Q.cur+1)%Q.ps.length;
app.innerHTML='<div class=load>Yükleniyor…</div>';
const sp=GAMES[cfg.game],aud=!!sp.a;let s,m=null,t=0;
do{s=pick();m=aud?await meta(s):null}while(aud&&!m&&++t<25);
if(aud&&!m){app.innerHTML='<p class="c q" style="margin-top:80px">Şarkılar yüklenemedi. İnternet bağlantını kontrol et.</p><button class=big onclick=setup()>Menü</button>';return}
q={s,m,sp,st:0,t0:Date.now(),left:15,done:0};
const L=x=>`${x.t} — ${x.a}`,U=(v,f)=>{const S=new Set([v]);for(const x of sh(Q.pool).concat(sh(SONGS))){if(S.size>3)break;S.add(f(x))}return sh([...S])};
const gs=[...new Set(SONGS.map(x=>x.g))],di=s.y?D.findIndex(d=>s.y>=d[1]&&s.y<d[2]):0,T=sp.t,k=sp.ask,dl=i=>D[i][0];
const oD=()=>sh([di,...sh([0,1,2,3,4,5].filter(i=>i!=di)).slice(0,3)]).map(dl),oG=()=>sh([s.g,...sh(gs.filter(x=>x!=s.g)).slice(0,3)]);
if(T=='aud'){
if(k=='t'){q.o=U(s.t,x=>x.t);q.ans=s.t}else if(k=='a'){q.o=U(s.a,x=>x.a);q.ans=s.a}else if(k=='e'){q.o=oD();q.ans=dl(di)}else if(k=='g'){q.o=oG();q.ans=s.g}
else{const r=Math.random()<.5,X=r?s.a:sh(SONGS.filter(x=>x.a!=s.a))[0].a;q.h=`Bu şarkı ${X} şarkısı mı?`;q.o=['Evet','Hayır'];q.ans=r?'Evet':'Hayır'}}
else if(T=='match'){q.h=`Hangisi ${s.a} şarkısı?`;q.o=sh([s.t,...sh(Q.pool.concat(SONGS).filter(x=>x.a!=s.a)).slice(0,3).map(x=>x.t)]);q.ans=s.t}
else if(T=='odd'){const grp=l=>{const b={};l.forEach(x=>(b[x.a]??=[]).push(x));return Object.values(b).filter(v=>v.length>=3)};
let G=grp(Q.pool);if(!G.length)G=grp(SONGS);const A=sh(G)[0],th=sh(A).slice(0,3),pl=Q.pool.filter(x=>x.a!=A[0].a),od=sh(pl.length?pl:SONGS.filter(x=>x.a!=A[0].a))[0];
q.s=od;q.o=sh([...th,od]).map(x=>x.t);q.ans=od.t;q.h='Hangisi farklı sanatçıya ait?';q.note=`Diğer üçü ${A[0].a} şarkısı`}
else if(T=='tn'){q.h=`“${s.t}” kimin şarkısı?`;q.o=U(s.a,x=>x.a);q.ans=s.a}
else if(T=='tg'){q.h=`“${s.t}” (${s.a}) hangi türde?`;q.o=oG();q.ans=s.g}
else if(T=='te'){q.h=`“${s.t}” (${s.a}) hangi dönemde çıktı?`;q.o=oD();q.ans=dl(di)}
else if(T=='gp'){q.h=`Hangisi ${s.g} şarkısı?`;q.o=sh([s.t,...sh(SONGS.filter(x=>x.g!=s.g)).slice(0,3).map(x=>x.t)]);q.ans=s.t}
else if(T=='dp'){q.h=`Hangisi ${dl(di)} şarkısı?`;q.o=sh([s.t,...sh(SONGS.filter(x=>x.y&&(x.y<D[di][1]||x.y>=D[di][2]))).slice(0,3).map(x=>x.t)]);q.ans=s.t}
else if(T=='lang'){const tr=sh(SONGS.filter(isTR))[0];q.s=tr;q.h='Hangisi Türkçe şarkı?';q.o=sh([tr.t,...sh(SONGS.filter(x=>!isTR(x))).slice(0,3).map(x=>x.t)]);q.ans=tr.t}
else if(T=='year'){const S=new Set([s.y]);for(const d of sh([-6,-4,-3,-2,-1,1,2,3,4,6])){if(S.size>3)break;if(s.y+d<=2026)S.add(s.y+d)}q.o=sh([...S]).map(String);q.ans=String(s.y);q.h=`“${s.t}” (${s.a}) hangi yıl çıktı?`}
else{const s2=sh(Q.pool.filter(x=>x.y&&x.y!=s.y))[0];q.s2=s2;q.o=sh([s,s2]).map(L);q.ans=L((s.y<s2.y)==(T=='older')?s:s2);q.h=T=='older'?'Hangisi daha önce çıktı?':'Hangisi daha yeni?'}
show()}

const STG=[1,3,5,10,30],TXT={t:'Bu hangi şarkı?',a:'Bu şarkıyı kim söylüyor?',e:'Bu şarkı hangi dönemden?',g:'Bu şarkı hangi türde?'},fy=x=>x.y?` (${x.y})`:'';
const board=()=>`<div class=sb>${Q.ps.map((p,i)=>`<div class="pl ${i==Q.cur?'me':''} ${p.l<=0?'out':''}">${av(p.av,24)}<span>${p.n}</span><b>${p.sc}</b>${p.k>=3?'🔥':''}${cfg.mode=='survival'?' '+'❤️'.repeat(Math.max(0,p.l)):''}</div>`).join('')}</div>`;
const playQ=()=>play(q.sp.stg?STG[q.st]:(q.sp.len||30),q.sp.rate||1,q.sp.off||0);
function show(){const sp=q.sp,s=q.s,au2=!!sp.a;
app.innerHTML=`${board()}<p class=sub>${Q.ps[Q.cur].n} sırada · ${sp.n} · Soru ${Q.asked+1}${cfg.mode=='survival'?'':'/'+Q.total}</p>
<div class=q>${q.h||TXT[sp.ask]||''}</div>${cfg.mode=='time'?`<div class=bar><i id=tb style="width:100%"></i></div>`:''}
${sp.cov?`<div class=cw><img id=cv class=cover src="${q.m.i}" style="${sp.cov=='blur'?'filter:blur(22px);transition:filter 20s linear':`transform:scale(7);transform-origin:${rnd(100)}% ${rnd(100)}%;transition:transform 20s linear`}"></div>`:''}
${au2?`<div class="row" style="justify-content:center"><button class=sm id=pb onclick="playQ()">▶ ${sp.stg?`Çal (${STG[0]} sn)`:'Çal'}</button>${sp.stg?`<button class=sm onclick="more()">➕ Daha uzun</button>`:''}<button class=sm onclick="stop()">⏹</button></div>${sp.stg?`<p class="c sub" id=pp>Alacağın puan: 5</p>`:''}`:''}
<div class=opts>${q.o.map((o,i)=>`<button class=opt id=b${i} onclick="ans(${i})">${o}</button>`).join('')}</div><div id=rv></div>`;
if(au2)playQ();
if(sp.cov)setTimeout(()=>{const c=$('cv');if(c){c.style.filter='blur(0)';c.style.transform='scale(1)'}},60);
if(cfg.mode=='time'){q.left=15;tk=setInterval(()=>{q.left-=.25;const b=$('tb');if(b)b.style.width=q.left/15*100+'%';if(q.left<=0)ans(-1)},250)}}
function more(){q.st=Math.min(4,q.st+1);$('pb').textContent=`▶ Çal (${STG[q.st]} sn)`;$('pp').textContent='Alacağın puan: '+(5-q.st);playQ()}
const pts=()=>{const sp=q.sp;return sp.stg?5-q.st:sp.cov?Math.max(1,5-Math.floor((Date.now()-q.t0)/4000)):3};
function ans(i){if(q.done)return;q.done=1;clearInterval(tk);
const p=Q.ps[Q.cur],ok=i>=0&&q.o[i]==q.ans;let pt=0;
if(ok){pt=pts();if(cfg.mode=='time'&&q.left>=8)pt++;p.k=(p.k||0)+1;if(p.k>=3)pt++;p.sc+=pt}else{p.k=0;if(cfg.mode=='survival')p.l--}
q.o.forEach((o,j)=>{const b=$('b'+j);b.disabled=true;if(o==q.ans)b.classList.add('ok');else if(j==i)b.classList.add('bad')});
const s=q.s,cv=$('cv');if(cv){cv.style.transition='none';cv.style.filter='blur(0)';cv.style.transform='scale(1)'}
$('rv').innerHTML=`${q.m&&!cv?`<img class=cover src="${q.m.i}" style="width:150px;height:150px">`:''}
<div class=msg>${ok?`✅ Doğru! +${pt} puan${p.k>=3?` · 🔥 ${p.k} seri`:''}`:(i<0?'⏰ Süre doldu':'❌ Yanlış')}<br><span style="font-weight:400;color:var(--mu)">${s.t} — ${s.a} ${fy(s)}${q.s2?`<br>${q.s2.t} — ${q.s2.a} ${fy(q.s2)}`:''}${q.note?'<br>'+q.note:''}</span></div>
<button class=big style="margin-top:6px" onclick="nx()">Sonraki ▶</button>`}
function nx(){stop();Q.asked++;Q.cur=(Q.cur+1)%Q.ps.length;next()}
function end(){stop();const r=[...Q.ps].sort((a,b)=>b.sc-a.sc),multi=Q.ps.length>1;
app.innerHTML=`<h1 class=c>🏁 Oyun bitti</h1>${multi?`<p class="c q">🏆 Kazanan: ${r[0].n}${r[1]&&r[1].sc==r[0].sc?' (beraberlik!)':''}</p>`:`<p class="c q">Skorun: ${r[0].sc}</p>`}
<div class=sb style="justify-content:center">${r.map(p=>`<div class=pl><b>${p.n}</b>: ${p.sc} puan</div>`).join('')}</div>
<button class=big onclick=startQuiz()>Tekrar oyna</button><button class="big" style="background:var(--card2)" onclick=setup()>Ana menü</button>`}

/* ---------- KUTU SAVAŞI ---------- */
function startBox(){const pl=players(),two=pl.length>1,names=two?[pl[0].n,pl[1].n]:[pl[0].n,'Bilgisayar'];
K={two,k:0,arts:sh(ARTISTS).slice(0,10).map(([n,p])=>({n,p,c:Math.max(1,Math.round(p/12*(.55+Math.random()*.9)))})),
ps:names.map(n=>({n,m:20,bx:[]}))};kb()}
function kb(){if(K.k>=10)return kend();
const pi=K.k%2,p=K.ps[pi],a=K.arts[K.k],bot=!K.two&&pi==1,left=5-p.bx.length,can=a.c<=p.m;
const cols=K.ps.map((x,i)=>`<div class="col ${i==pi?'me':''}"><b>${x.n}</b> · 💵 $${x.m}${Array.from({length:5},(_,j)=>{const b=x.bx[j];return `<div class=bx>${b?(b.y?`✅ ${b.a.n} <small>($${b.a.c})</small>`:`❌ ${b.a.n} <small>(geçildi)</small>`):'📦 Kapalı kutu'}</div>`}).join('')}</div>`).join('');
app.innerHTML=`<h1>📦 Kutu Savaşı</h1><p class=sub>Her oyuncunun 20$’ı ve 5 kutusu var. Fiyat bir ipucu verir ama bazen yanıltır. Oyun sonunda herkesin gerçek “fan gücü” açıklanır, toplamı en yüksek olan kazanır.</p>
<div class=boxes>${cols}</div>
<div class=pick><div class=sub>${p.n} · Kutu ${p.bx.length+1} açıldı</div><div class=n>${a.n}</div><div class=pr>$${a.c}</div>
${bot?'<p class=sub>Bilgisayar düşünüyor…</p>':`<div class=row style="justify-content:center;margin-top:12px"><button class=sm ${can?'':'disabled'} onclick="buy(1)">💰 Satın al</button><button class=sm onclick="buy(0)">Geç</button></div>${can?'':'<p class=sub>Yeterli paran yok.</p>'}`}</div>`;
if(bot)setTimeout(()=>buy(can&&(left==1||a.c<=p.m/left*1.4)?1:0),1400)}
function buy(y){const pi=K.k%2,p=K.ps[pi],a=K.arts[K.k];if(y){p.m-=a.c}p.bx.push({a,y});K.k++;kb()}
function kend(){K.ps.forEach(p=>p.sc=p.bx.filter(b=>b.y).reduce((s,b)=>s+b.a.p,0));
const r=[...K.ps].sort((a,b)=>b.sc-a.sc);
app.innerHTML=`<h1 class=c>🏁 Sonuçlar</h1><p class="c q">🏆 ${r[0].sc==r[1].sc?'Beraberlik!':'Kazanan: '+r[0].n}</p>
<div class=boxes>${K.ps.map(p=>`<div class=col><b>${p.n}</b> · Toplam: <b>${p.sc}</b>${p.k>=3?' 🔥':''} · Kalan 💵 $${p.m}${p.bx.map(b=>`<div class=bx style="${b.y?'':'opacity:.5'}">${b.a.n}<br><small>Fan gücü ${b.a.p} · fiyat $${b.a.c} · ${b.y?'✅ alındı':'❌ geçildi'}</small></div>`).join('')}</div>`).join('')}</div>
<button class=big onclick=startBox()>Tekrar oyna</button><button class="big" style="background:var(--card2)" onclick=setup()>Ana menü</button>`}

init();
</script>
</body>
