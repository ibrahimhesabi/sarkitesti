<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Şarkı Arenası</title>
<style>
:root{color-scheme:dark;--bg:#0a0a14;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.12);--tx:#f4f4fb;--mu:#a3a3c2;--ac:#a259ff;--ok:#2ecc71;--bad:#ff5c6c;--bd:rgba(255,255,255,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 10% 0,#5b2bff66,transparent),radial-gradient(500px 400px at 100% 25%,#ff2d8a44,transparent),radial-gradient(600px 500px at 40% 100%,#00d4ff33,transparent);animation:bg 14s ease-in-out infinite alternate}
@keyframes bg{to{transform:scale(1.2) rotate(4deg)}}
#app{max-width:900px;margin:0 auto;padding:14px 14px 70px}
.hero{text-align:center;padding:24px 8px 6px}
.hero h1{font-size:clamp(36px,9vw,60px);margin:10px 0 4px;letter-spacing:-2px;background:linear-gradient(90deg,#fff,#c9a6ff,#ff7ac6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p,.sub{color:var(--mu);margin:0 0 6px}
.eq{display:flex;gap:5px;height:44px;align-items:flex-end;justify-content:center}
.eq i{width:7px;height:100%;border-radius:4px;background:linear-gradient(#ff7ac6,#a259ff);animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2n){animation-delay:.25s}.eq i:nth-child(3n){animation-delay:.5s}
@keyframes eq{from{height:10%}to{height:100%}}
h2{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:30px 0 12px}
h2 b{background:var(--ac);color:#fff;border-radius:50%;display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:12px}
.gc{position:relative;overflow:hidden;text-align:left;font:inherit;color:inherit;cursor:pointer;border:1px solid var(--bd);border-radius:18px;padding:16px;background:var(--card);transition:.2s;backdrop-filter:blur(8px)}
.gc::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--g));opacity:.16;transition:.2s}
.gc:hover{transform:translateY(-3px)}.gc.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac),0 12px 40px -10px var(--ac)}.gc.on::before{opacity:.55}
.gc span{font-size:32px;display:block;position:relative}.gc b,.gc small{position:relative;display:block}.gc small{color:#d4d4ee;margin-top:4px;font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip,.sm,.big,.opt{font:inherit;color:inherit;cursor:pointer}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:8px 15px;transition:.15s}
.chip:hover{background:var(--card2)}.chip.on{background:var(--ac);border-color:var(--ac);font-weight:700}
input{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:11px;font:inherit;width:48%}
.big{display:block;width:100%;background:linear-gradient(90deg,#a259ff,#ff4d8d);border:0;border-radius:16px;padding:16px;font-weight:800;font-size:18px;margin-top:22px;box-shadow:0 10px 30px -8px #a259ffaa;transition:.2s}
.big:hover{transform:translateY(-2px) scale(1.01)}
.sm{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:11px 16px;transition:.15s}.sm:hover{background:var(--ac)}.sm:disabled{opacity:.4}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:560px){.opts,.boxes{grid-template-columns:1fr}}
.opt{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 14px;font-weight:700;font-size:16px;transition:.15s;backdrop-filter:blur(8px)}
.opt:hover:not(:disabled){transform:translateY(-2px);background:var(--card2);border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:#1d6b3f;animation:pop .45s}.opt.bad{border-color:var(--bad);background:#7a2330;animation:shk .4s}
@keyframes pop{50%{transform:scale(1.06)}}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.sb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;z-index:5;padding:8px 0;backdrop-filter:blur(10px)}
.pl{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 13px;font-size:14px}.pl.me{border-color:var(--ac);box-shadow:0 0 18px -4px var(--ac)}.pl.out{opacity:.35}
.cover{width:min(260px,68vw);height:min(260px,68vw);border-radius:22px;display:block;margin:14px auto;object-fit:cover;box-shadow:0 25px 60px -15px var(--ac)}
.c{text-align:center}.q{font-size:clamp(20px,4.5vw,26px);font-weight:800;text-align:center;margin:10px 0}
.msg{text-align:center;font-weight:800;font-size:18px;margin:14px 0}
.load{text-align:center;margin-top:100px;color:var(--mu)}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px}.col.me{border-color:var(--ac);box-shadow:0 0 24px -6px var(--ac)}
.bx{background:var(--card2);border-radius:12px;margin-top:7px;padding:10px;font-size:14px;min-height:42px}
.pick{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:22px;padding:22px;text-align:center;margin-top:16px;animation:pop .5s}
.pick .n{font-size:30px;font-weight:900}.pick .pr{font-size:40px;color:var(--ok);font-weight:900}
.bar{height:8px;background:var(--card2);border-radius:9px;margin:6px 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d8d,#a259ff)}
</style>
</head>

maNga|We Could Be the Same

Ahmet Kaya|Şafak Türküsü;Acılara Tutunmak
Bergen|Acıların Kadını
Ajda Pekkan|Bambaşka Biri`.split('\n').forEach(l=>{if(l[0]=='#')return _g=l.slice(1);const[a,r]=l.split('|');r.split(';').forEach(x=>{const[t,y]=x.split('~');SONGS.push({a,t,y:+y||0,g:_g})})});

/* Kutu Savaşı: ünlü ve "fan gücü" (oyun sonunda açıklanır) */
const ARTISTS=`Michael Jackson|98
Taylor Swift|97
Beyoncé|94
Eminem|92
Drake|91
Rihanna|90
The Weeknd|90
Freddie Mercury|91
Adele|89
Madonna|88

Justin Bieber|86
Shakira|85
Kendrick Lamar|85
Coldplay|84
Britney Spears|83
Tarkan|80
Dua Lipa|80
Katy Perry|79
Sezen Aksu|78
Snoop Dogg|78
Post Malone|77
Travis Scott|76
Ajda Pekkan|70
Hadise|62
Sertab Erener|60
Kenan Doğulu|58`.split('\n').map(l=>{const[n,p]=l.split('|');return[n,+p]});

const gk=k=>s=>s.g==k,dec=(a,b)=>s=>s.y>=a&&s.y<b,TRX=/^TR|Arabesk/;
const CATS={'Karışık':()=>1,'Yabancı':s=>!TRX.test(s.g),'Türkçe':s=>TRX.test(s.g),'Pop':gk('Pop'),'Rock':gk('Rock'),'Metal':gk('Metal'),'İngilizce Rap':gk('İngilizce Rap'),'R&B':gk('R&B'),'Dans':gk('Dans'),'Latin':gk('Latin'),'TR Pop':gk('TR Pop'),'TR Rap':gk('TR Rap'),'TR Rock':gk('TR Rock'),'Arabesk':gk('Arabesk'),'70’ler ve öncesi':dec(1,1980),'80’ler':dec(1980,1990),'90’lar':dec(1990,2000),'2000’ler':dec(2000,2010),'2010’lar':dec(2010,2020),'2020’ler':dec(2020,2030)};
const GAMES={guess:['🎧','Şarkıyı Tahmin Et','1 sn’den başla, erken bilen çok puan alır','#a259ff,#5b6cff'],artist:['🎤','Sanatçıyı Bul','Çalan şarkıyı kim söylüyor?','#ff4d8d,#ff9a3c'],cover:['🖼️','Albüm Kapağı','Bulanık kapak yavaşça netleşir','#00c6ff,#0072ff'],speed:['⏩','Hız Bozuk','Yavaş ya da hızlı çalan şarkıyı bil','#f7971e,#ffd200'],era:['🕰️','Hangi Dönem?','Dinle, hangi on yıldan olduğunu bul','#43e97b,#38f9d7'],genre:['🎸','Hangi Tür?','Pop mu, rock mı, rap mi? Kulağına güven','#fa709a,#fee140'],match:['🧩','Kimin Şarkısı?','Sanatçıya ait şarkıyı seç','#667eea,#764ba2'],odd:['🕵️','Aykırı Şarkıyı Bul','3 şarkı aynı sanatçıdan, 1’i değil','#f093fb,#f5576c'],year:['📅','Hangi Yıl?','Şarkının çıkış yılını bil','#4facfe,#00f2fe'],older:['⌛','Hangisi Daha Eski?','İki şarkıdan eski olanı seç','#c471f5,#fa71cd'],box:['📦','Kutu Savaşı','20$ bütçeyle ünlüleri satın al (2 kişilik)','#11998e,#38ef7d']};
const AUD=['guess','artist','cover','speed','era','genre'];
const D=[['70’ler ve öncesi',0,1980],['80’ler',1980,1990],['90’lar',1990,2000],['2000’ler',2000,2010],['2010’lar',2010,2020],['2020’ler',2020,2030]];
const MODES={normal:'Klasik (10 soru)',time:'Zamana karşı (15 sn)',survival:'Hayatta kal (3 can)'};

const $=id=>document.getElementById(id),app=$('app');
const sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cfg={game:'guess',mode:'normal',cat:'Karışık',n:1,names:['','','','']};
const au=new Audio();let tm,tk,Q,q,K;

/* ---------- iTunes önizleme + kapak ---------- */
const cache={},norm=x=>x.toLocaleLowerCase('tr').replace(/[^a-z0-9ğüşıöçâî]/g,'');
const BAD=/remix|\bmix\b|live|karaoke|cover|\bedit\b|acoustic|instrumental|slowed|sped|tribute|version|demo|rework|mashup|8d|nightcore|lullaby|piano|reprise|re-?record|\bdub\b|extended|bootleg|flip|sessions|unplugged/i,BADC=/remix|karaoke|tribute|cover|lullaby|workout|party hits|piano/i;
function meta(s){return cache[s.a+s.t]??=fetch('https://itunes.apple.com/search?entity=song&limit=30&term='+encodeURIComponent(s.a+' '+s.t.replace(/[^\p{L}\p{N} ]/gu,' ')))
.then(r=>r.json()).then(d=>{const T=norm(s.t),A=norm(s.a).slice(0,4);let best=null,bs=0;
for(const x of d.results){if(!x.previewUrl)continue;const tn=x.trackName,base=norm(tn.replace(/\(.*?\)|\[.*?\]/g,''));let c=0;
if(base==T)c+=5;else continue;
if(!norm(x.artistName).includes(A))continue;c+=4;
if((!BAD.test(tn)&&!BADC.test(x.collectionName))||BAD.test(s.t))c+=3;
if(s.y){const e=Math.abs(+x.releaseDate.slice(0,4)-s.y);c+=e==0?3:e<=1?2:e<=3?1:0}
if(c>bs){bs=c;best=x}}
return best&&bs>=12?{u:best.previewUrl,i:best.artworkUrl100.replace('100x100','400x400')}:null}).catch(()=>null)}
function play(sec,rate=1){clearTimeout(tm);au.pause();au.src=q.m.u;au.preservesPitch=au.mozPreservesPitch=au.webkitPreservesPitch=false;
au.playbackRate=rate;au.currentTime=0;au.play().catch(()=>{});if(sec)tm=setTimeout(()=>au.pause(),sec*1000/rate)}
const stop=()=>{clearTimeout(tm);clearInterval(tk);au.pause()};

/* ---------- ANA MENÜ ---------- */
function set(k,v){cfg[k]=v;if(k=='game'&&v=='box'&&cfg.n>2)cfg.n=2;setup()}
function setup(){stop();
const box=cfg.game=='box',maxN=box?2:4;
app.innerHTML=`<header class=hero><div class=eq><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><h1>Şarkı Arenası</h1><p>${SONGS.length} şarkı · ${Object.keys(GAMES).length} oyun · tek ya da çok kişili</p></header>
<h2><b>1</b>Oyununu seç</h2><div class=grid>${Object.entries(GAMES).map(([k,g])=>`<button class="gc ${cfg.game==k?'on':''}" style="--g:${g[3]}" onclick="set('game','${k}')"><span>${g[0]}</span><b>${g[1]}</b><small>${g[2]}</small></button>`).join('')}</div>
${box?'':`<h2><b>2</b>Mod</h2><div class=row>${Object.entries(MODES).map(([k,v])=>`<button class="chip ${cfg.mode==k?'on':''}" onclick="set('mode','${k}')">${v}</button>`).join('')}</div>
<h2><b>3</b>Kategori</h2><div class=row>${Object.keys(CATS).map(k=>`<button class="chip ${cfg.cat==k?'on':''}" onclick="set('cat','${k}')">${k}</button>`).join('')}</div>`}
<h2><b>${box?2:4}</b>Oyuncular</h2><div class=row>${[1,2,3,4].filter(i=>i<=maxN).map(i=>`<button class="chip ${cfg.n==i?'on':''}" onclick="set('n',${i})">${i==1?(box?'Tek kişi (bilgisayara karşı)':'Tek kişi'):i+' kişi'}</button>`).join('')}</div>
${cfg.n>1?`<div class=row style="margin-top:10px">${Array.from({length:cfg.n},(_,i)=>`<input placeholder="Oyuncu ${i+1}" value="${cfg.names[i]}" oninput="cfg.names[${i}]=this.value">`).join('')}</div>`:''}
<button class=big onclick="${box?'startBox()':'startQuiz()'}">Başla ▶</button>`}

/* ---------- SORU OYUNLARI ---------- */
function startQuiz(){
const need=['year','older','era'].includes(cfg.game),pool=SONGS.filter(CATS[cfg.cat]).filter(x=>!need||x.y);
if(pool.length<6){app.innerHTML='<p class="c q" style="margin-top:80px">Bu kategoride bu oyun için yeterli şarkı yok.</p><button class=big onclick=setup()>Menüye dön</button>';return}
Q={pool,bag:[],cur:0,asked:0,total:cfg.mode=='survival'?9999:Math.min(10,pool.length)*cfg.n,
ps:Array.from({length:cfg.n},(_,i)=>({n:cfg.n>1?(cfg.names[i]||'Oyuncu '+(i+1)):'Sen',sc:0,l:3}))};next()}
let seen={};try{seen=JSON.parse(localStorage.seen||'{}')}catch(e){}
const pick=()=>{if(!Q.bag.length){const p=sh(Q.pool);let u=p.filter(x=>!seen[x.a+x.t]);if(u.length<Math.min(8,p.length)){p.forEach(x=>delete seen[x.a+x.t]);u=p}Q.bag=u}
const s=Q.bag.pop();seen[s.a+s.t]=1;try{localStorage.seen=JSON.stringify(seen)}catch(e){}return s};
const opts=(f,v)=>{const S=new Set([v]);for(const x of sh(Q.pool).concat(sh(SONGS))){if(S.size>3)break;S.add(f(x))}return sh([...S])};

async function next(){
if(Q.asked>=Q.total||!Q.ps.some(p=>p.l>0))return end();
while(Q.ps[Q.cur].l<=0)Q.cur=(Q.cur+1)%Q.ps.length;
app.innerHTML='<div class=load><div class=eq><i></i><i></i><i></i><i></i><i></i></div><p>Şarkı yükleniyor…</p></div>';
const g=cfg.game,aud=AUD.includes(g);let s,m=null,t=0;
do{s=pick();m=aud?await meta(s):null}while(aud&&!m&&++t<20);
if(aud&&!m){app.innerHTML='<p class="c q" style="margin-top:80px">Şarkılar yüklenemedi. İnternet bağlantını kontrol et.</p><button class=big onclick=setup()>Menü</button>';return}
q={s,m,st:0,t0:Date.now(),left:15,done:0};
const oth=f=>{const S=new Set([f(s)]);for(const x of sh(Q.pool).concat(sh(SONGS))){if(S.size>3)break;if(x.a!=s.a||g!='match')S.add(f(x))}return sh([...S])};
if(['guess','cover','speed'].includes(g)){q.o=oth(x=>x.t);q.ans=s.t}
if(g=='artist'){q.o=oth(x=>x.a);q.ans=s.a}
if(g=='genre'){const S=new Set([s.g]);for(const x of sh(SONGS)){if(S.size>3)break;S.add(x.g)}q.o=sh([...S]);q.ans=s.g}
if(g=='match'){const S=new Set([s.t]);for(const x of sh(Q.pool).concat(sh(SONGS))){if(S.size>3)break;if(x.a!=s.a)S.add(x.t)}q.o=sh([...S]);q.ans=s.t;q.h=`Hangisi ${s.a} şarkısı?`}
if(g=='era'){const di=D.findIndex(d=>s.y>=d[1]&&s.y<d[2]),S=new Set([di]);for(const i of sh([0,1,2,3,4,5])){if(S.size>3)break;S.add(i)}q.o=sh([...S]).map(i=>D[i][0]);q.ans=D[di][0]}
if(g=='year'){const S=new Set([s.y]);for(const d of sh([-6,-4,-3,-2,-1,1,2,3,4,6])){if(S.size>3)break;if(s.y+d<=2026)S.add(s.y+d)}q.o=sh([...S]).map(String);q.ans=String(s.y);q.h=`“${s.t}” (${s.a}) hangi yıl çıktı?`}
if(g=='older'){const l=Q.pool.filter(x=>x.y&&x.y!=s.y),s2=sh(l)[0];q.s2=s2;q.o=sh([s,s2]).map(x=>`${x.t} — ${x.a}`);const o=s.y<s2.y?s:s2;q.ans=`${o.t} — ${o.a}`}
if(g=='odd'){const grp=l=>{const b={};l.forEach(x=>(b[x.a]??=[]).push(x));return Object.values(b).filter(v=>v.length>=3)};
let G=grp(Q.pool);if(!G.length)G=grp(SONGS);const A=sh(G)[0],three=sh(A).slice(0,3),pl=Q.pool.filter(x=>x.a!=A[0].a),odd=sh(pl.length?pl:SONGS.filter(x=>x.a!=A[0].a))[0];
q.s=odd;q.o=sh([...three,odd]).map(x=>x.t);q.ans=odd.t;q.h='Hangisi farklı sanatçıya ait?';q.note=`Diğer üçü ${A[0].a} şarkısı`}
if(g=='speed')q.rate=Math.random()<.5?.65:1.6;
show()}

const TXT={guess:'Bu hangi şarkı?',artist:'Bu şarkıyı kim söylüyor?',cover:'Kapağa bak, şarkıyı bul!',speed:'Bozuk çalan şarkı hangisi?',older:'Hangisi daha önce çıktı?',era:'Bu şarkı hangi dönemden?',genre:'Bu şarkı hangi türde?'};const fy=x=>x.y?` (${x.y})`:'';
const STG=[1,3,5,10,30];
const board=()=>`<div class=sb>${Q.ps.map((p,i)=>`<div class="pl ${i==Q.cur?'me':''} ${p.l<=0?'out':''}">${p.n}: <b>${p.sc}</b>${p.k>=3?' 🔥':''}${cfg.mode=='survival'?' '+'❤️'.repeat(Math.max(0,p.l)):''}</div>`).join('')}</div>`;
function show(){const g=cfg.game,s=q.s;
const qn=cfg.mode=='survival'?`Soru ${Q.asked+1}`:`Soru ${Q.asked+1}/${Q.total}`;
app.innerHTML=`${board()}<p class=sub>${Q.ps[Q.cur].n} sırada · ${qn} · ${cfg.cat}</p>
<div class=q>${q.h||TXT[g]}</div>
${cfg.mode=='time'?`<div class=bar><i id=tb style="width:100%"></i></div>`:''}
${g=='cover'?`<img id=cv class=cover src="${q.m.i}" style="filter:blur(22px);transition:filter 20s linear">`:''}
${g=='guess'?`<div class="row" style="justify-content:center"><button class=sm id=pb onclick="play(STG[q.st])">▶ Çal (${STG[0]} sn)</button><button class=sm onclick="more()">➕ Daha uzun dinle</button></div><p class="c sub" id=pp>Şu an alacağın puan: 5</p>`:''}
${AUD.includes(g)&&g!='guess'?`<div class=c><button class=sm onclick="play(30,q.rate||1)">▶ Tekrar çal</button> <button class=sm onclick="stop()">⏹</button></div>`:''}
<div class=opts>${q.o.map((o,i)=>`<button class=opt id=b${i} onclick="ans(${i})">${o}</button>`).join('')}</div><div id=rv></div>`;
if(g=='guess')play(STG[0]);
if(AUD.includes(g)&&g!='guess')play(30,q.rate||1);
if(g=='cover')setTimeout(()=>{const c=$('cv');if(c)c.style.filter='blur(0)'},60);
if(cfg.mode=='time'){q.left=15;tk=setInterval(()=>{q.left-=.25;const b=$('tb');if(b)b.style.width=q.left/15*100+'%';if(q.left<=0)ans(-1)},250)}}
function more(){q.st=Math.min(4,q.st+1);$('pb').textContent=`▶ Çal (${STG[q.st]} sn)`;$('pp').textContent='Şu an alacağın puan: '+(5-q.st);play(STG[q.st])}
const pts=()=>{const g=cfg.game;return g=='guess'?5-q.st:g=='cover'?Math.max(1,5-Math.floor((Date.now()-q.t0)/4000)):3};
function ans(i){if(q.done)return;q.done=1;clearInterval(tk);
const p=Q.ps[Q.cur],ok=i>=0&&q.o[i]==q.ans;let pt=0;
if(ok){pt=pts();if(cfg.mode=='time'&&q.left>=8)pt++;p.k=(p.k||0)+1;if(p.k>=3)pt++;p.sc+=pt}else{p.k=0;if(cfg.mode=='survival')p.l--}
q.o.forEach((o,j)=>{const b=$('b'+j);b.disabled=true;if(o==q.ans)b.classList.add('ok');else if(j==i)b.classList.add('bad')});
const s=q.s,cv=$('cv');if(cv){cv.style.transition='none';cv.style.filter='blur(0)'}
$('rv').innerHTML=`${q.m&&!cv?`<img class=cover src="${q.m.i}" style="width:150px;height:150px">`:''}
<div class=msg>${ok?`✅ Doğru! +${pt} puan${p.k>=3?` · 🔥 ${p.k} seri`:''}`:(i<0?'⏰ Süre doldu':'❌ Yanlış')}<br><span style="font-weight:400;color:var(--mu)">${s.t} — ${s.a} ${fy(s)}${q.s2?`<br>${q.s2.t} — ${q.s2.a} ${fy(q.s2)}`:''}${q.note?'<br>'+q.note:''}</span></div>
<button class=big style="margin-top:6px" onclick="nx()">Sonraki ▶</button>`}
function nx(){stop();Q.asked++;Q.cur=(Q.cur+1)%Q.ps.length;next()}
function end(){stop();const r=[...Q.ps].sort((a,b)=>b.sc-a.sc),multi=Q.ps.length>1;
app.innerHTML=`<h1 class=c>🏁 Oyun bitti</h1>${multi?`<p class="c q">🏆 Kazanan: ${r[0].n}${r[1]&&r[1].sc==r[0].sc?' (beraberlik!)':''}</p>`:`<p class="c q">Skorun: ${r[0].sc}</p>`}
<div class=sb style="justify-content:center">${r.map(p=>`<div class=pl><b>${p.n}</b>: ${p.sc} puan</div>`).join('')}</div>
<button class=big onclick=startQuiz()>Tekrar oyna</button><button class="big" style="background:var(--card2)" onclick=setup()>Ana menü</button>`}

/* ---------- KUTU SAVAŞI ---------- */
function startBox(){const two=cfg.n==2;
const names=two?[cfg.names[0]||'Oyuncu 1',cfg.names[1]||'Oyuncu 2']:['Sen','Bilgisayar'];
K={two,k:0,arts:sh(ARTISTS).slice(0,10).map(([n,p])=>({n,p,c:Math.max(1,Math.round(p/12*(.55+Math.random()*.9)))})),
ps:names.map(n=>({n,m:20,bx:[]}))};kb()}
function kb(){if(K.k>=10)return kend();
const pi=K.k%2,p=K.ps[pi],a=K.arts[K.k],bot=!K.two&&pi==1,left=5-p.bx.length,can=a.c<=p.m;
const cols=K.ps.map((x,i)=>`<div class="col ${i==pi?'me':''}"><b>${x.n}</b> · 💵 $${x.m}${Array.from({length:5},(_,j)=>{const b=x.bx[j];return `<div class=bx>${b?(b.y?`✅ ${b.a.n} <small>($${b.a.c})</small>`:`❌ ${b.a.n} <small>(geçildi)</small>`):'📦 Kapalı kutu'}</div>`}).join('')}</div>`).join('');
app.innerHTML=`<h1>📦 Kutu Savaşı</h1><p class=sub>Her oyuncunun 20$’ı ve 5 kutusu var. Fiyat bir ipucu verir ama bazen yanıltır. Oyun sonunda herkesin gerçek “fan gücü” açıklanır, toplamı en yüksek olan kazanır.</p>
<div class=boxes>${cols}</div>
<div class=pick><div class=sub>${p.n} · Kutu ${p.bx.length+1} açıldı</div><div class=n>${a.n}</div><div class=pr>$${a.c}</div>
${bot?'<p class=sub>Bilgisayar düşünüyor…</p>':`<div class=row style="justify-content:center;margin-top:12px"><button class=sm ${can?'':'disabled'} onclick="buy(1)">💰 Satın al</button><button class=sm onclick="buy(0)">Geç</button></div>${can?'':'<p class=sub>Yeterli paran yok.</p>'}`}</div>`;
if(bot)setTimeout(()=>buy(can&&(left==1||a.c<=p.m/left*1.4)?1:0),1400)}
function buy(y){const pi=K.k%2,p=K.ps[pi],a=K.arts[K.k];if(y){p.m-=a.c}p.bx.push({a,y});K.k++;kb()}
function kend(){K.ps.forEach(p=>p.sc=p.bx.filter(b=>b.y).reduce((s,b)=>s+b.a.p,0));
const r=[...K.ps].sort((a,b)=>b.sc-a.sc);
app.innerHTML=`<h1 class=c>🏁 Sonuçlar</h1><p class="c q">🏆 ${r[0].sc==r[1].sc?'Beraberlik!':'Kazanan: '+r[0].n}</p>
<div class=boxes>${K.ps.map(p=>`<div class=col><b>${p.n}</b> · Toplam: <b>${p.sc}</b>${p.k>=3?' 🔥':''} · Kalan 💵 $${p.m}${p.bx.map(b=>`<div class=bx style="${b.y?'':'opacity:.5'}">${b.a.n}<br><small>Fan gücü ${b.a.p} · fiyat $${b.a.c} · ${b.y?'✅ alındı':'❌ geçildi'}</small></div>`).join('')}</div>`).join('')}</div>
<button class=big onclick=startBox()>Tekrar oyna</button><button class="big" style="background:var(--card2)" onclick=setup()>Ana menü</button>`}

setup();
</script>
</body>
</html>
