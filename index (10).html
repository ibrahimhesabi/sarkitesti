<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Şarkı Arenası</title>
<style>
:root{color-scheme:dark;--bg:#0f0f1a;--card:#1b1b2e;--card2:#26263d;--tx:#f2f2f7;--mu:#9a9ab5;--ac:#a259ff;--ok:#2ecc71;--bad:#ff5c6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:760px;margin:0 auto;padding:18px 14px 50px}
h1{font-size:28px;margin:6px 0 2px}h2{font-size:15px;color:var(--mu);margin:22px 0 8px;font-weight:600}
.sub{color:var(--mu);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card,.opt,.chip,button{font:inherit;color:inherit}
.card{background:var(--card);border:2px solid transparent;border-radius:14px;padding:12px;cursor:pointer;text-align:left}
.card.on{border-color:var(--ac);background:var(--card2)}.card b{display:block}.card small{color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:2px solid transparent;border-radius:99px;padding:7px 14px;cursor:pointer}
.chip.on{border-color:var(--ac);background:var(--card2)}
input{background:var(--card);border:1px solid var(--card2);color:var(--tx);border-radius:10px;padding:9px;font:inherit;width:48%}
.big{background:var(--ac);border:0;border-radius:14px;padding:14px 22px;font-weight:700;cursor:pointer;margin-top:20px;width:100%;font-size:17px}
.sm{background:var(--card2);border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:var(--card);border:2px solid var(--card2);border-radius:12px;padding:14px;cursor:pointer;font-weight:600}
.opt.ok{border-color:var(--ok);background:#173a27}.opt.bad{border-color:var(--bad);background:#3a1a20}
.sb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pl{background:var(--card);border-radius:10px;padding:7px 12px;border:2px solid transparent;font-size:14px}.pl.me{border-color:var(--ac)}.pl.out{opacity:.4}
.cover{width:230px;height:230px;border-radius:16px;background:var(--card2);display:block;margin:12px auto;object-fit:cover}
.c{text-align:center}.q{font-size:20px;font-weight:700;text-align:center;margin:8px 0}
.msg{text-align:center;font-weight:700;margin:12px 0}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{background:var(--card);border-radius:14px;padding:10px}.col.me{outline:2px solid var(--ac)}
.bx{background:var(--card2);border-radius:10px;margin-top:6px;padding:9px;font-size:14px;min-height:40px}
.pick{background:var(--card2);border-radius:16px;padding:18px;text-align:center;margin-top:14px}
.pick .n{font-size:26px;font-weight:800}.pick .pr{font-size:34px;color:var(--ok);font-weight:800}
.bar{height:6px;background:var(--card2);border-radius:9px;margin:4px 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- VERİ: bilindik, popüler şarkılar (Sanatçı|Şarkı|Yıl|Tür) ---------- */
const SONGS=`Michael Jackson|Billie Jean|1983|Pop
Michael Jackson|Thriller|1982|Pop
Madonna|Like a Prayer|1989|Pop
Whitney Houston|I Wanna Dance with Somebody|1987|Pop
Britney Spears|...Baby One More Time|1998|Pop
Rihanna|Umbrella|2007|Pop
Katy Perry|Roar|2013|Pop
Taylor Swift|Shake It Off|2014|Pop
Ed Sheeran|Shape of You|2017|Pop
Adele|Rolling in the Deep|2010|Pop
Dua Lipa|Levitating|2020|Pop
The Weeknd|Blinding Lights|2019|Pop
Billie Eilish|bad guy|2019|Pop
Lady Gaga|Bad Romance|2009|Pop
Bruno Mars|Uptown Funk|2014|Pop
Harry Styles|As It Was|2022|Pop
Beyoncé|Halo|2008|Pop
Shakira|Hips Don’t Lie|2006|Pop
Coldplay|Viva la Vida|2008|Pop
Queen|Bohemian Rhapsody|1975|Rock
Queen|Don’t Stop Me Now|1979|Rock
Nirvana|Smells Like Teen Spirit|1991|Rock
Guns N’ Roses|Sweet Child o’ Mine|1987|Rock
AC/DC|Back in Black|1980|Rock
Led Zeppelin|Stairway to Heaven|1971|Rock
Eagles|Hotel California|1976|Rock
Metallica|Nothing Else Matters|1992|Rock
Linkin Park|In the End|2001|Rock
Green Day|Boulevard of Broken Dreams|2004|Rock
The Killers|Mr. Brightside|2004|Rock
Oasis|Wonderwall|1995|Rock
Bon Jovi|Livin’ on a Prayer|1986|Rock
Imagine Dragons|Believer|2017|Rock
Pink Floyd|Another Brick in the Wall|1979|Rock
Eminem|Lose Yourself|2002|Rap
Eminem|Without Me|2002|Rap
50 Cent|In Da Club|2003|Rap
Kendrick Lamar|HUMBLE.|2017|Rap
Drake|God’s Plan|2018|Rap
Dr. Dre|Still D.R.E.|1999|Rap
Post Malone|Rockstar|2017|Rap
Travis Scott|SICKO MODE|2018|Rap
Jay-Z|Empire State of Mind|2009|Rap
Kanye West|Stronger|2007|Rap
2Pac|California Love|1995|Rap
Tarkan|Şımarık|1997|Türkçe
Tarkan|Kuzu Kuzu|2001|Türkçe
Tarkan|Dudu|2003|Türkçe
Hadise|Düm Tek Tek|2009|Türkçe
Sertab Erener|Everyway That I Can|2003|Türkçe
Kenan Doğulu|Shake It Up Şekerim|2007|Türkçe`.split('\n').map(l=>{const[a,t,y,g]=l.split('|');return{a,t,y:+y,g}});

/* Kutu Savaşı: ünlü ve "fan gücü" (oyun sonunda açıklanır) */
const ARTISTS=`Michael Jackson|98
Taylor Swift|97
Beyoncé|94
Eminem|92
Drake|91
Rihanna|90
The Weeknd|90
Freddie Mercury|91
Adele|89
Madonna|88
Lady Gaga|88
Ed Sheeran|88
Bruno Mars|87
Billie Eilish|86
Justin Bieber|86
Shakira|85
Kendrick Lamar|85
Coldplay|84
Britney Spears|83
Tarkan|80
Dua Lipa|80
Katy Perry|79
Sezen Aksu|78
Snoop Dogg|78
Post Malone|77
Travis Scott|76
Ajda Pekkan|70
Hadise|62
Sertab Erener|60
Kenan Doğulu|58`.split('\n').map(l=>{const[n,p]=l.split('|');return[n,+p]});

const CATS={'Karışık':()=>1,'Pop':s=>s.g=='Pop','Rock':s=>s.g=='Rock','Rap':s=>s.g=='Rap','Türkçe':s=>s.g=='Türkçe',
"80’ler":s=>s.y>=1980&&s.y<1990,"90’lar":s=>s.y>=1990&&s.y<2000,"2000’ler":s=>s.y>=2000&&s.y<2010,"2010’lar+":s=>s.y>=2010};
const GAMES={guess:['🎧','Şarkıyı Tahmin Et','1 sn’den başla, ne kadar erken bilirsen o kadar puan'],
artist:['🎤','Sanatçıyı Bul','Çalan şarkıyı kim söylüyor?'],
cover:['🖼️','Albüm Kapağı','Bulanık kapak yavaşça netleşir'],
speed:['⏩','Hız Bozuk','Şarkı yavaş ya da hızlı çalar'],
year:['📅','Hangi Yıl?','Şarkının çıkış yılını bil'],
older:['⌛','Hangisi Daha Eski?','İki şarkıdan eski olanı seç'],
box:['📦','Kutu Savaşı','20$ bütçeyle 5 kutudan çıkan ünlüleri satın al (2 kişilik)']};
const MODES={normal:'Klasik (10 soru)',time:'Zamana karşı (15 sn)',survival:'Hayatta kal (3 can)'};

const $=id=>document.getElementById(id),app=$('app');
const sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cfg={game:'guess',mode:'normal',cat:'Karışık',n:1,names:['','','','']};
const au=new Audio();let tm,tk,Q,q,K;

/* ---------- iTunes önizleme + kapak ---------- */
const cache={},norm=x=>x.toLowerCase().replace(/[^a-z0-9ğüşıöç]/g,'');
function meta(s){return cache[s.t]??=fetch('https://itunes.apple.com/search?entity=song&limit=8&term='+encodeURIComponent(s.a+' '+s.t))
.then(r=>r.json()).then(d=>{const k=norm(s.t).slice(0,5),a=norm(s.a).slice(0,4);
const r=d.results.find(x=>x.previewUrl&&norm(x.trackName).includes(k)&&norm(x.artistName).includes(a))||d.results.find(x=>x.previewUrl&&norm(x.trackName).includes(k));
return r?{u:r.previewUrl,i:r.artworkUrl100.replace('100x100','400x400')}:null}).catch(()=>null)}
function play(sec,rate=1){clearTimeout(tm);au.pause();au.src=q.m.u;au.preservesPitch=au.mozPreservesPitch=au.webkitPreservesPitch=false;
au.playbackRate=rate;au.currentTime=0;au.play().catch(()=>{});if(sec)tm=setTimeout(()=>au.pause(),sec*1000/rate)}
const stop=()=>{clearTimeout(tm);clearInterval(tk);au.pause()};

/* ---------- ANA MENÜ ---------- */
function set(k,v){cfg[k]=v;if(k=='game'&&v=='box'&&cfg.n>2)cfg.n=2;setup()}
function setup(){stop();
const box=cfg.game=='box',maxN=box?2:4;
app.innerHTML=`<h1>🎵 Şarkı Arenası</h1><p class=sub>Bilindik şarkılarla müzik oyunları. Tek kişi ya da aynı cihazda sırayla çok kişi.</p>
<h2>OYUN</h2><div class=grid>${Object.entries(GAMES).map(([k,g])=>`<button class="card ${cfg.game==k?'on':''}" onclick="set('game','${k}')">${g[0]} <b>${g[1]}</b><small>${g[2]}</small></button>`).join('')}</div>
${box?'':`<h2>MOD</h2><div class=row>${Object.entries(MODES).map(([k,v])=>`<button class="chip ${cfg.mode==k?'on':''}" onclick="set('mode','${k}')">${v}</button>`).join('')}</div>
<h2>KATEGORİ</h2><div class=row>${Object.keys(CATS).map(k=>`<button class="chip ${cfg.cat==k?'on':''}" onclick="set('cat','${k}')">${k}</button>`).join('')}</div>`}
<h2>OYUNCU</h2><div class=row>${[1,2,3,4].filter(i=>i<=maxN).map(i=>`<button class="chip ${cfg.n==i?'on':''}" onclick="set('n',${i})">${i==1?(box?'Tek kişi (bilgisayara karşı)':'Tek kişi'):i+' kişi'}</button>`).join('')}</div>
${cfg.n>1?`<div class=row style="margin-top:10px">${Array.from({length:cfg.n},(_,i)=>`<input placeholder="Oyuncu ${i+1}" value="${cfg.names[i]}" oninput="cfg.names[${i}]=this.value">`).join('')}</div>`:''}
<button class=big onclick="${box?'startBox()':'startQuiz()'}">Başla ▶</button>`}

/* ---------- SORU OYUNLARI ---------- */
function startQuiz(){
const pool=SONGS.filter(CATS[cfg.cat]);
Q={pool,bag:[],cur:0,asked:0,total:cfg.mode=='survival'?9999:Math.min(10,pool.length)*cfg.n,
ps:Array.from({length:cfg.n},(_,i)=>({n:cfg.n>1?(cfg.names[i]||'Oyuncu '+(i+1)):'Sen',sc:0,l:3}))};next()}
const pick=()=>{if(!Q.bag.length)Q.bag=sh(Q.pool);return Q.bag.pop()};
const opts=(f,v)=>{const S=new Set([v]);for(const x of sh(Q.pool).concat(sh(SONGS))){if(S.size>3)break;S.add(f(x))}return sh([...S])};

async function next(){
if(Q.asked>=Q.total||!Q.ps.some(p=>p.l>0))return end();
while(Q.ps[Q.cur].l<=0)Q.cur=(Q.cur+1)%Q.ps.length;
app.innerHTML='<p class=c style="margin-top:80px">Şarkı yükleniyor…</p>';
const g=cfg.game,aud=g!='year'&&g!='older';let s,m=null,t=0;
do{s=pick();m=aud?await meta(s):null}while(aud&&!m&&++t<8);
if(aud&&!m){app.innerHTML='<p class=c style="margin-top:80px">Şarkılar yüklenemedi. İnternet bağlantını kontrol et.</p><button class=big onclick=setup()>Menü</button>';return}
q={s,m,st:0,t0:Date.now(),left:15,done:0};
if(g=='guess'||g=='cover'||g=='speed'){q.o=opts(x=>x.t,s.t);q.ans=s.t}
if(g=='artist'){q.o=opts(x=>x.a,s.a);q.ans=s.a}
if(g=='year'){const S=new Set([s.y]);for(const d of sh([-6,-4,-3,-2,-1,1,2,3,4,6])){if(S.size>3)break;if(s.y+d<=2026)S.add(s.y+d)}q.o=sh([...S]).map(String);q.ans=String(s.y)}
if(g=='older'){let s2;do{s2=sh(SONGS)[0]}while(s2.y==s.y);q.s2=s2;q.o=sh([s,s2]).map(x=>`${x.t} — ${x.a}`);const o=s.y<s2.y?s:s2;q.ans=`${o.t} — ${o.a}`}
if(g=='speed')q.rate=Math.random()<.5?.65:1.6;
show()}

const TXT={guess:'Bu hangi şarkı?',artist:'Bu şarkıyı kim söylüyor?',cover:'Kapağa bak, şarkıyı bul!',speed:'Bozuk çalan şarkı hangisi?',older:'Hangisi daha önce çıktı?'};
const STG=[1,3,5,10,30];
const board=()=>`<div class=sb>${Q.ps.map((p,i)=>`<div class="pl ${i==Q.cur?'me':''} ${p.l<=0?'out':''}">${p.n}: <b>${p.sc}</b>${cfg.mode=='survival'?' '+'❤️'.repeat(Math.max(0,p.l)):''}</div>`).join('')}</div>`;
function show(){const g=cfg.game,s=q.s;
const qn=cfg.mode=='survival'?`Soru ${Q.asked+1}`:`Soru ${Q.asked+1}/${Q.total}`;
app.innerHTML=`${board()}<p class=sub>${Q.ps[Q.cur].n} sırada · ${qn} · ${cfg.cat}</p>
<div class=q>${g=='year'?`“${s.t}” (${s.a}) hangi yıl çıktı?`:TXT[g]}</div>
${cfg.mode=='time'?`<div class=bar><i id=tb style="width:100%"></i></div>`:''}
${g=='cover'?`<img id=cv class=cover src="${q.m.i}" style="filter:blur(22px);transition:filter 20s linear">`:''}
${g=='guess'?`<div class="row" style="justify-content:center"><button class=sm id=pb onclick="play(STG[q.st])">▶ Çal (${STG[0]} sn)</button><button class=sm onclick="more()">➕ Daha uzun dinle</button></div><p class="c sub" id=pp>Şu an alacağın puan: 5</p>`:''}
${g=='artist'||g=='speed'||g=='cover'?`<div class=c><button class=sm onclick="play(30,q.rate||1)">▶ Tekrar çal</button> <button class=sm onclick="stop()">⏹</button></div>`:''}
<div class=opts>${q.o.map((o,i)=>`<button class=opt id=b${i} onclick="ans(${i})">${o}</button>`).join('')}</div><div id=rv></div>`;
if(g=='guess')play(STG[0]);
if(g=='artist'||g=='speed'||g=='cover')play(30,q.rate||1);
if(g=='cover')setTimeout(()=>{const c=$('cv');if(c)c.style.filter='blur(0)'},60);
if(cfg.mode=='time'){q.left=15;tk=setInterval(()=>{q.left-=.25;const b=$('tb');if(b)b.style.width=q.left/15*100+'%';if(q.left<=0)ans(-1)},250)}}
function more(){q.st=Math.min(4,q.st+1);$('pb').textContent=`▶ Çal (${STG[q.st]} sn)`;$('pp').textContent='Şu an alacağın puan: '+(5-q.st);play(STG[q.st])}
const pts=()=>{const g=cfg.game;return g=='guess'?5-q.st:g=='cover'?Math.max(1,5-Math.floor((Date.now()-q.t0)/4000)):3};
function ans(i){if(q.done)return;q.done=1;clearInterval(tk);
const p=Q.ps[Q.cur],ok=i>=0&&q.o[i]==q.ans;let pt=0;
if(ok){pt=pts();if(cfg.mode=='time'&&q.left>=8)pt++;p.sc+=pt}else if(cfg.mode=='survival')p.l--;
q.o.forEach((o,j)=>{const b=$('b'+j);b.disabled=true;if(o==q.ans)b.classList.add('ok');else if(j==i)b.classList.add('bad')});
const s=q.s,cv=$('cv');if(cv){cv.style.transition='none';cv.style.filter='blur(0)'}
$('rv').innerHTML=`${q.m&&!cv?`<img class=cover src="${q.m.i}" style="width:150px;height:150px">`:''}
<div class=msg>${ok?`✅ Doğru! +${pt} puan`:(i<0?'⏰ Süre doldu':'❌ Yanlış')}<br><span style="font-weight:400;color:var(--mu)">${s.t} — ${s.a} (${s.y})${q.s2?`<br>${q.s2.t} — ${q.s2.a} (${q.s2.y})`:''}</span></div>
<button class=big style="margin-top:6px" onclick="nx()">Sonraki ▶</button>`}
function nx(){stop();Q.asked++;Q.cur=(Q.cur+1)%Q.ps.length;next()}
function end(){stop();const r=[...Q.ps].sort((a,b)=>b.sc-a.sc),multi=Q.ps.length>1;
app.innerHTML=`<h1 class=c>🏁 Oyun bitti</h1>${multi?`<p class="c q">🏆 Kazanan: ${r[0].n}${r[1]&&r[1].sc==r[0].sc?' (beraberlik!)':''}</p>`:`<p class="c q">Skorun: ${r[0].sc}</p>`}
<div class=sb style="justify-content:center">${r.map(p=>`<div class=pl><b>${p.n}</b>: ${p.sc} puan</div>`).join('')}</div>
<button class=big onclick=startQuiz()>Tekrar oyna</button><button class="big" style="background:var(--card2)" onclick=setup()>Ana menü</button>`}

/* ---------- KUTU SAVAŞI ---------- */
function startBox(){const two=cfg.n==2;
const names=two?[cfg.names[0]||'Oyuncu 1',cfg.names[1]||'Oyuncu 2']:['Sen','Bilgisayar'];
K={two,k:0,arts:sh(ARTISTS).slice(0,10).map(([n,p])=>({n,p,c:Math.max(1,Math.round(p/12*(.55+Math.random()*.9)))})),
ps:names.map(n=>({n,m:20,bx:[]}))};kb()}
function kb(){if(K.k>=10)return kend();
const pi=K.k%2,p=K.ps[pi],a=K.arts[K.k],bot=!K.two&&pi==1,left=5-p.bx.length,can=a.c<=p.m;
const cols=K.ps.map((x,i)=>`<div class="col ${i==pi?'me':''}"><b>${x.n}</b> · 💵 $${x.m}${Array.from({length:5},(_,j)=>{const b=x.bx[j];return `<div class=bx>${b?(b.y?`✅ ${b.a.n} <small>($${b.a.c})</small>`:`❌ ${b.a.n} <small>(geçildi)</small>`):'📦 Kapalı kutu'}</div>`}).join('')}</div>`).join('');
app.innerHTML=`<h1>📦 Kutu Savaşı</h1><p class=sub>Her oyuncunun 20$’ı ve 5 kutusu var. Fiyat bir ipucu verir ama bazen yanıltır. Oyun sonunda herkesin gerçek “fan gücü” açıklanır, toplamı en yüksek olan kazanır.</p>
<div class=boxes>${cols}</div>
<div class=pick><div class=sub>${p.n} · Kutu ${p.bx.length+1} açıldı</div><div class=n>${a.n}</div><div class=pr>$${a.c}</div>
${bot?'<p class=sub>Bilgisayar düşünüyor…</p>':`<div class=row style="justify-content:center;margin-top:12px"><button class=sm ${can?'':'disabled'} onclick="buy(1)">💰 Satın al</button><button class=sm onclick="buy(0)">Geç</button></div>${can?'':'<p class=sub>Yeterli paran yok.</p>'}`}</div>`;
if(bot)setTimeout(()=>buy(can&&(left==1||a.c<=p.m/left*1.4)?1:0),1400)}
function buy(y){const pi=K.k%2,p=K.ps[pi],a=K.arts[K.k];if(y){p.m-=a.c}p.bx.push({a,y});K.k++;kb()}
function kend(){K.ps.forEach(p=>p.sc=p.bx.filter(b=>b.y).reduce((s,b)=>s+b.a.p,0));
const r=[...K.ps].sort((a,b)=>b.sc-a.sc);
app.innerHTML=`<h1 class=c>🏁 Sonuçlar</h1><p class="c q">🏆 ${r[0].sc==r[1].sc?'Beraberlik!':'Kazanan: '+r[0].n}</p>
<div class=boxes>${K.ps.map(p=>`<div class=col><b>${p.n}</b> · Toplam: <b>${p.sc}</b> · Kalan 💵 $${p.m}${p.bx.map(b=>`<div class=bx style="${b.y?'':'opacity:.5'}">${b.a.n}<br><small>Fan gücü ${b.a.p} · fiyat $${b.a.c} · ${b.y?'✅ alındı':'❌ geçildi'}</small></div>`).join('')}</div>`).join('')}</div>
<button class=big onclick=startBox()>Tekrar oyna</button><button class="big" style="background:var(--card2)" onclick=setup()>Ana menü</button>`}

setup();
</script>
</body>
</html>
